server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 64KB
  servlet:
    context-path: /api/v1

spring:
  application:
    name: agencia-hub-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    # Default: PostgreSQL on localhost:5432. If auth fails, see README (wrong host vs Docker, or stale volume).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agenciahub}
    username: ${DB_USER:agenciahub}
    password: ${DB_PASSWORD:agenciahub}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # SMTP opcional (ex.: Railway Pro+). Por omissão host vazio → JavaMail não é configurado.
  # Em Free/Hobby o Railway bloqueia SMTP; use Resend (email.resend.api-key) via HTTPS.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:15000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:15000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:15000}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  packages-to-scan: com.agenciahub.api.controller

# Swagger "Servers" URL for Try it out (override in prod)
openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080/api/v1}

# JWT
jwt:
  secret: ${JWT_SECRET:agenciahub-dev-secret-change-in-production-min32chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 h

# CORS — lista de origens separadas por virgula (ou * para dev)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Resend (HTTPS) — default path for transactional mail (Railway Hobby etc.)
email:
  from: ${EMAIL_FROM:contato@agenciashub.com.br}
  resend:
    api-key: ${EMAIL_RESEND_API_KEY:}
    connect-timeout-ms: ${EMAIL_RESEND_CONNECT_TIMEOUT_MS:15000}
    read-timeout-ms: ${EMAIL_RESEND_READ_TIMEOUT_MS:30000}

# Application base URL (used for invite links, etc.)
app:
  base-url: ${APP_BASE_URL:https://agenciashub.com.br}
  # Backend-specific base URL used for unsubscribe links in emails.
  # If unset, falls back to app.base-url (may cause 404 when frontend and backend have different domains).
  api-base-url: ${APP_API_BASE_URL:}

# Rate limit por IP (Bucket4j em memória; por instância). Atrás de proxy confiável, ative TRUST_X_FORWARDED_FOR=true.
agenciahub:
  flyway:
    # Flyway.repair() antes de migrate: corrige checksum na flyway_schema_history quando o ficheiro
    # de uma migração já aplicada mudou (merge/renomeação). Desative com AGENCIAHUB_FLYWAY_REPAIR_BEFORE_MIGRATE=false
    # em todos os ambientes estáveis, se quiser detetar alterações acidentais a migrações antigas.
    repair-before-migrate: ${AGENCIAHUB_FLYWAY_REPAIR_BEFORE_MIGRATE:true}
  ratelimit:
    enabled: true
    trust-x-forwarded-for: ${TRUST_X_FORWARDED_FOR:false}
    public-submit-per-minute: ${RATE_LIMIT_PUBLIC_SUBMIT_PER_MINUTE:15}
    public-config-get-per-minute: ${RATE_LIMIT_PUBLIC_CONFIG_GET_PER_MINUTE:120}
    public-terms-get-per-minute: ${RATE_LIMIT_PUBLIC_TERMS_GET_PER_MINUTE:120}
    auth-login-per-minute: ${RATE_LIMIT_AUTH_LOGIN_PER_MINUTE:30}
    auth-register-per-hour: ${RATE_LIMIT_AUTH_REGISTER_PER_HOUR:15}
    auth-forgot-password-per-hour: ${RATE_LIMIT_AUTH_FORGOT_PER_HOUR:8}
    auth-resend-code-per-hour: ${RATE_LIMIT_AUTH_RESEND_PER_HOUR:10}
    auth-verify-email-per-minute: ${RATE_LIMIT_AUTH_VERIFY_PER_MINUTE:5}
    auth-reset-password-per-minute: ${RATE_LIMIT_AUTH_RESET_PER_MINUTE:5}
    auth-register-invite-per-hour: ${RATE_LIMIT_AUTH_REGISTER_INVITE_PER_HOUR:15}
    auth-invite-get-per-minute: ${RATE_LIMIT_AUTH_INVITE_GET_PER_MINUTE:60}
    docs-get-per-minute: ${RATE_LIMIT_DOCS_GET_PER_MINUTE:120}
    public-consent-revoke-per-hour: ${RATE_LIMIT_PUBLIC_CONSENT_REVOKE_PER_HOUR:3}

terms:
  current-version: ${TERMS_CURRENT_VERSION:1.0}

logging:
  level:
    org.springframework.web: INFO
    com.agenciahub: DEBUG
