services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenciahub
      POSTGRES_USER: agenciahub
      POSTGRES_PASSWORD: agenciahub
    ports:
      # Host 5433 avoids clashing with a system PostgreSQL already bound to 5432
      - "5433:5432"
    volumes:
      - agenciahub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenciahub -d agenciahub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agenciahub_pg_data:
