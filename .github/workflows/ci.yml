name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenciahub_test
          POSTGRES_USER: agenciahub
          POSTGRES_PASSWORD: agenciahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenciahub -d agenciahub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile -q

      - name: Run Flyway migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: agenciahub_test
          DB_USER: agenciahub
          DB_PASSWORD: agenciahub
          JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
        run: |
          mvn flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/agenciahub_test -Dflyway.user=agenciahub -Dflyway.password=agenciahub -q

      - name: Package (skip tests for now)
        run: mvn package -DskipTests -q

      - name: Verify JAR exists
        run: ls target/*.jar
